<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Svarna Dipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Huruf: Aptos Narrow bila terpasang (Office 365), cadangan Archivo Narrow; merek raksasa memakai Archivo tebal -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Archivo:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Desain Svarna Dipa (disetujui Joe 27 Okt 2026, purwarupa versi 32): warna gelap dashboard GIO,
   huruf Aptos Narrow besar kapital, kartu rata tengah, merek SVARNA DIPA raksasa ala kaki bugatti.com. */
:root {
  --bg: #11171d; --kartu: #18212a; --kartu-2: #1d2833; --teks: #e6ecf1; --redup: #9aa8b5; --garis: #2a3642;
  --aksen: #6fb3d2; --aksen-tua: #2b6382; --navy: #11171d;
  --hijau: #5cc28d; --kuning: #e0a84a; --merah: #f08a80; --abu: #9aa8b5;
  --latar-hijau: #1c3428; --latar-kuning: #3a2f1c; --latar-merah: #3a2220; --latar-abu: #1d2833;
  --bayang: 0 1px 2px rgba(0, 0, 0, .3); --bayang-naik: 0 8px 24px rgba(0, 0, 0, .35);
  --f: "Aptos Narrow", "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* layar masuk & isi disembunyikan lewat atribut hidden */
/* Ukuran bawaan 75% di layar laptop/komputer (arahan Joe 27 Okt 2026); HP tetap 100% supaya terbaca */
:root { --skala: 1; }
@media (min-width: 700px) { :root { --skala: .75; } html { zoom: .75; } }
body { margin: 0; background: var(--bg); color: var(--teks); font: 19px/1.45 var(--f); text-transform: uppercase; letter-spacing: .03em; -webkit-font-smoothing: antialiased; }
input, button, select { text-transform: uppercase; }
input::placeholder { text-transform: uppercase; }
.bungkus { max-width: 1360px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: 96px; }
h1 { font-size: clamp(34px, 4.4vw, 58px); margin: 0; line-height: 1.05; letter-spacing: .04em; font-weight: 600; text-wrap: balance; }
h2 { font-size: clamp(24px, 2.4vw, 32px); margin: 36px 0 4px; letter-spacing: .04em; font-weight: 600; }
.redup { color: var(--redup); font-size: 16px; }
.ikon { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.15em; flex: none; }
button { font: inherit; font-size: 16px; font-weight: 600; letter-spacing: .08em; padding: 12px 22px; border: 1px solid var(--teks); border-radius: 999px; background: transparent; color: var(--teks); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
button:hover { background: var(--teks); color: var(--bg); }
button:disabled { opacity: .4; cursor: default; background: transparent; color: var(--teks); }
button.tipis { border-color: rgba(255, 255, 255, .25); padding: 10px 18px; font-size: 15px; }
button.tipis:hover { border-color: var(--teks); background: rgba(255, 255, 255, .06); color: var(--teks); }
:focus-visible { outline: 1px solid var(--aksen); outline-offset: 3px; }

/* Merek raksasa: SVG selebar layar, huruf berbintik, terlihat hanya di sekitar mouse (cara kerja kaki bugatti.com) */
@property --sorot-x { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
.merek-raksasa { width: 100%; color: var(--teks); user-select: none;
  -webkit-mask-image: radial-gradient(circle at var(--sorot-x) 50%, #000 0%, transparent 60%);
  mask-image: radial-gradient(circle at var(--sorot-x) 50%, #000 0%, transparent 60%); }
.merek-raksasa svg { display: block; width: 100%; height: auto; opacity: .4; }
.merek-raksasa text { font-family: "Archivo", "Arial Black", sans-serif; font-weight: 800; }
@keyframes sorot-jalan { from { --sorot-x: 0%; } to { --sorot-x: 100%; } }
@media (hover: none) { .merek-raksasa { animation: sorot-jalan 7s ease-in-out infinite alternate; } }
@media (prefers-reduced-motion: reduce) { .merek-raksasa { animation: none; --sorot-x: 50%; } }
.atas-merek { border-bottom: 1px solid var(--garis); }

/* Layar masuk */
body.layar-masuk { min-height: calc(100vh / var(--skala)); }
#masuk { min-height: calc(100vh / var(--skala)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vh; padding-block: 4vh 6vh; overflow: hidden; text-align: center; }
#masuk .isi-masuk { width: min(520px, 100%); padding-inline: 16px; display: flex; flex-direction: column; gap: 14px; }
#masuk input { width: 100%; height: 64px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); background: var(--aksen-tua); color: #fff;
  font: 600 22px var(--f); letter-spacing: .04em; text-align: center; padding: 0 28px; outline: none; transition: background .2s, box-shadow .2s; }
#masuk input::placeholder { color: rgba(255, 255, 255, .9); }
#masuk input { text-transform: none; }   /* sandi tampil persis yang diketik (huruf besar/kecil), tulisan petunjuk tetap kapital */
#masuk input::placeholder { text-transform: uppercase; }
/* Petunjuk SANDI selalu terlihat: besar di tengah saat kosong, mengecil ke atas kolom saat diketik (arahan Joe) */
.kolom-sandi { position: relative; }
.kolom-sandi label { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none;
  color: rgba(255, 255, 255, .9); font: 600 22px var(--f); letter-spacing: .04em; transition: top .15s, font-size .15s, transform .15s; }
.kolom-sandi input:focus + label, .kolom-sandi input:not(:placeholder-shown) + label { top: 7px; transform: none; font-size: 12px; letter-spacing: .14em; color: rgba(255, 255, 255, .75); }
.kolom-sandi input:focus, .kolom-sandi input:not(:placeholder-shown) { padding-top: 16px; }
@media (prefers-reduced-motion: reduce) { .kolom-sandi label { transition: none; } }
#masuk input:focus { background: #2f6d8f; box-shadow: 0 0 0 4px rgba(111, 179, 210, .28); }
#masuk input:not(:placeholder-shown) { letter-spacing: .3em; }
#masuk button[type=submit] { height: 64px; font-size: 22px; border-color: rgba(255, 255, 255, .22); }
#galat { color: var(--merah); min-height: 22px; font-size: 16px; font-weight: 600; }
#masuk .catatan-masuk { color: var(--redup); font-size: 16px; margin: 6px 0 0; }

/* Pita atas + kepala halaman */
.atas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--garis); }
.atas .bungkus { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding-bottom: 0; flex-wrap: wrap; }
.atas .merek { font-weight: 600; font-size: 24px; letter-spacing: .3em; }
.atas .kanan { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 8px; }
.pita { padding: 18px 0 18px; }
.pita .bungkus { padding-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
.pita .sub { color: var(--redup); font-size: 17px; max-width: 95ch; }
.remah { display: flex; flex-wrap: wrap; gap: 8px; }
.remah span { color: var(--redup); font-size: 15px; font-weight: 600; letter-spacing: .1em; display: inline-flex; gap: 6px; align-items: center; }
.remah span + span::before { content: "/"; margin-right: 8px; color: var(--garis); }
.angkat { margin-top: 0; }
.langkah-menu { display: flex; gap: 8px; flex-wrap: wrap; }
.langkah-menu span { font-size: 14px; font-weight: 600; letter-spacing: .1em; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--garis); color: var(--redup); }
.langkah-menu span.aktif { border-color: var(--aksen); color: var(--aksen); }

/* Kartu cabang / gudang: judul rata atas & tengah, keterangan di dasar */
.pilih { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.cab { background: linear-gradient(165deg, var(--kartu-2), var(--kartu) 60%); border: 1px solid var(--garis); border-radius: 6px; padding: 24px 22px 20px; cursor: pointer; color: var(--teks);
  width: 100%; min-height: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; letter-spacing: .03em; font-weight: 400; }
.cab:hover { border-color: var(--aksen); background: linear-gradient(165deg, var(--kartu-2), var(--kartu) 60%); color: var(--teks); }
.cab.dipilih { border-color: var(--aksen); }
.cab .nama { font-weight: 600; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; letter-spacing: .04em; }
.cab .nilai { font-size: 64px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.cab .nilai span { font-size: 18px; font-weight: 600; letter-spacing: .1em; margin-left: 6px; }
.cab .ket { margin-top: auto; padding-top: 10px; color: var(--redup); font-size: 14px; font-weight: 600; letter-spacing: .1em; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Kesimpulan */
.vonis { background: var(--kartu); border: 1px solid var(--garis); border-radius: 6px; padding: 22px; display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.cincin { width: 160px; height: 160px; border-radius: 50%; background: conic-gradient(var(--hijau) calc(var(--p) * 1%), var(--latar-abu) 0); display: grid; place-items: center; }
.cincin div { width: 126px; height: 126px; border-radius: 50%; background: var(--kartu); display: grid; place-items: center; text-align: center; line-height: 1.05; }
.cincin b { font-size: 44px; font-weight: 600; }
.cincin small { font-size: 13px; color: var(--redup); font-weight: 600; letter-spacing: .1em; }
.vonis .besar { font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.25; }
.vonis .kecil { font-size: 19px; margin-top: 6px; }
.status-pil { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; letter-spacing: .08em; color: var(--w); background: var(--lw); border-radius: 999px; padding: 4px 12px; margin-bottom: 10px; }
.angka-kecil { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.angka-kecil div { background: var(--kartu-2); border: 1px solid var(--garis); border-radius: 6px; padding: 8px 14px; font-size: 14px; color: var(--redup); font-weight: 600; letter-spacing: .06em; }
.angka-kecil b { display: block; font-size: 30px; color: var(--w); font-weight: 600; letter-spacing: 0; }
@media (max-width: 600px) { .vonis { grid-template-columns: 1fr; justify-items: center; text-align: center; } .angka-kecil { justify-content: center; } }

/* Kartu masalah (latar = tingkat prioritas: merah tinggi, kuning sedang, hijau rendah) */
.masalah { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; margin-top: 14px; }
.m { background: var(--lw); border: 1px solid color-mix(in srgb, var(--w) 30%, transparent); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.m .kepala-m { display: flex; align-items: center; gap: 12px; }
.m .prioritas { margin-left: auto; align-self: flex-start; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--w); border: 1px solid var(--w); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.m .bulat { width: 44px; height: 44px; border-radius: 6px; background: var(--kartu); color: var(--w); display: grid; place-items: center; font-size: 22px; flex: none; }
.m .angka { font-size: 40px; font-weight: 600; color: var(--w); line-height: 1; }
.m .angka small { font-size: 16px; font-weight: 600; color: var(--redup); }
.m .judul { font-size: 21px; font-weight: 600; line-height: 1.3; }
.m .arti { font-size: 17px; color: var(--redup); }
.m .langkah { font-size: 17px; background: var(--kartu); border-radius: 6px; padding: 10px 12px; }
.m .langkah b { display: block; font-size: 13px; color: var(--w); letter-spacing: .1em; margin-bottom: 2px; }
.m button { margin-top: auto; }
.m.nol { opacity: .55; }

/* Daftar DO */
.pilihan { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.pilihan select, .pilihan input { padding: 12px 16px; border: 1px solid var(--garis); border-radius: 999px; background: var(--kartu); color: var(--teks); font: inherit; font-size: 16px; max-width: 100%; outline: none; }
.pilihan input { flex: 1 1 260px; }
.pilihan select:focus, .pilihan input:focus { border-color: var(--aksen); }
.kalimat-saring { margin-top: 14px; font-weight: 600; }
.do { background: var(--kartu); border: 1px solid var(--garis); border-radius: 6px; padding: 14px 16px 14px 20px; margin-top: 10px; cursor: pointer; position: relative; transition: border-color .15s; }
.do::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--w); }
.do:hover { border-color: var(--aksen); }
.do .atas { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; position: static; background: none; border: 0; }
.do .nomor { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 19px; }
.do .toko { margin-top: 2px; }
.do .tanda { display: inline-block; font-size: 15px; font-weight: 600; color: var(--w); background: var(--lw); border-radius: 6px; padding: 3px 9px; margin-top: 6px; }
.do .rinci { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--garis); display: none; }
.do.buka .rinci { display: block; }
.do .buka-teks { font-size: 14px; color: var(--aksen); font-weight: 600; letter-spacing: .08em; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 17px; margin-top: 8px; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--garis); text-align: left; }
th { color: var(--redup); font-weight: 600; font-size: 14px; letter-spacing: .1em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gulir { overflow-x: auto; }
.halaman { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; }
.kosong { background: var(--kartu); border: 1px solid var(--garis); border-radius: 6px; padding: 24px; text-align: center; color: var(--redup); margin-top: 10px; }
.peringatan { margin-top: 14px; padding: 12px 14px; border-radius: 6px; background: var(--latar-kuning); color: var(--teks); border: 1px solid var(--kuning); font-weight: 600; }
details { margin-top: 32px; background: var(--kartu); border: 1px solid var(--garis); border-radius: 6px; padding: 14px 16px; }
summary { cursor: pointer; font-weight: 600; color: var(--redup); letter-spacing: .06em; }
.kamus dt { font-weight: 600; margin-top: 10px; }
.kamus dd { margin: 0; color: var(--redup); }
.kaki { text-align: center; color: var(--redup); font-size: 16px; letter-spacing: .1em; margin-top: 32px; }

/* Pita "Ada data terbaru" dan kabar singkat, mengambang di bawah layar */
.mengambang { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10; width: max-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
  background: var(--kartu-2); color: var(--teks); border: 1px solid var(--garis); border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: var(--bayang-naik); font-weight: 600; font-size: 16px; }
.mengambang button { padding: 9px 16px; }
.kabar { padding: 12px 20px; bottom: 150px; font-weight: 600; }
#pitaBaru { bottom: 90px; }
#pitaBaru[hidden], #kabar[hidden] { display: none; }

/* Tombol Tanya Bot WMS (grup WhatsApp ALL GUDANG SVARNA DIPA); hanya muncul setelah sandi benar */
.tombol-wa { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 11; display: flex; align-items: center; gap: 8px; background: #25d366; color: #0b2a17; text-decoration: none;
  font-weight: 700; font-size: 16px; letter-spacing: .06em; border-radius: 999px; padding: 14px 18px 14px 14px; box-shadow: 0 10px 30px rgba(37, 211, 102, .35); }
.tombol-wa .ikon { font-size: 24px; }
.tombol-wa[hidden] { display: none; }
.tanya-wa { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 15px; font-weight: 600; color: #7be3a6; text-decoration: none;
  border: 1px solid #2f6b47; border-radius: 999px; padding: 7px 14px; }
@media (prefers-reduced-motion: reduce) { button, .do { transition: none; } }
</style>
</head>
<body class="layar-masuk">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="derauMerek"><feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="4" result="derau"/><feComposite in="SourceGraphic" in2="derau" operator="in"/></filter></svg>
<form id="masuk" autocomplete="on">
  <div class="merek-raksasa" aria-label="Svarna Dipa"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2468.89 283.47" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">
    <text x="0" y="273" font-size="380" textLength="2468.89" lengthAdjust="spacingAndGlyphs" filter="url(#derauMerek)">SVARNA DIPA</text></svg></div>
  <div class="isi-masuk">
    <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
    <div class="kolom-sandi"><input id="sandi" type="password" name="password" autocomplete="current-password" placeholder=" " required><label for="sandi">Sandi</label></div>
    <div id="galat"></div>
    <button type="submit">Masuk</button>
    <p class="catatan-masuk">Khusus untuk karyawan. Isi halaman ini rahasia perusahaan dan hanya boleh dipakai untuk pekerjaan gudang. Jangan bagikan sandi, tangkapan layar, atau isinya kepada pihak luar.</p>
  </div>
</form>
<style>#masuk[hidden] ~ .kelola-wadah { display: none; }</style>
<!-- Menu Kelola akun BERSAMA (BEN, 31 Okt 2026): satu sumber untuk layar sandi web induk (terbit_web.py GERBANG)
     dan Panel Gudang (Bot WMS dashboard.py). Joe 31 Okt: "kelola akun di modul gudang harus muncul setiap ada perubahan";
     tanpa layar masuk ("tetap dibuang") - pembatasnya: layanan kelola_web.py hanya menerima perangkat Tailscale. -->
<div class="kelola-wadah">
<style>
  #kelolaBuka.kelola-tombol, #kelola button { font: 600 14px "Aptos Narrow", "Archivo Narrow", "Arial Narrow", system-ui, sans-serif; text-transform: uppercase;
    border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; background: transparent; color: #e6ecf1; cursor: pointer; }
  #kelolaBuka.kelola-tombol:hover, #kelola button:hover { background: #e6ecf1; color: #11171d; }
  #kelola { color: #e6ecf1; font: 17px/1.45 "Aptos Narrow", "Archivo Narrow", "Arial Narrow", system-ui, sans-serif; letter-spacing: .03em; }
  #kelola input, #kelola select { width: 100%; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); color: #fff;
    font: 600 18px "Aptos Narrow", "Archivo Narrow", sans-serif; outline: none; }
  #kelola .pilih-halaman input { width: 18px; }
  /* Menu Kelola akun di layar masuk (Joe 30 Okt 2026): khusus administrator, dari perangkat Tailscale */
  #kelolaBuka.kelola-tombol { position: fixed; top: 14px; left: 14px; z-index: 3; height: auto; padding: 10px 16px; font-size: 14px;
    letter-spacing: .12em; background: rgba(17, 23, 29, .85); }
  #kelola { position: fixed; inset: 0; z-index: 4; overflow: auto; background: rgba(0, 0, 0, .6); text-transform: none; }
  #kelola[hidden] { display: none; }
  #kelola .kotak { width: min(720px, calc(100% - 32px)); margin: 5vh auto; box-sizing: border-box; background: #11171d;
    border: 1px solid #2a3642; border-radius: 22px; padding: 22px; text-align: left; font-size: 16px; letter-spacing: .02em; }
  #kelola form { min-height: 0; display: block; padding: 0; text-align: left; }
  #kelola .kepala { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  #kelola .kepala b { flex: 1; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; }
  #kelola button { height: auto; font-size: 14px; padding: 9px 16px; letter-spacing: .1em; }
  #kelola input, #kelola select { height: 50px; font-size: 18px; text-align: left; padding: 0 18px; background: #18212a; text-transform: none; }
  #kelola select { width: 100%; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); color: #fff; font: 600 18px "Aptos Narrow", "Archivo Narrow", sans-serif; }
  #kelola label.isian { display: block; margin: 12px 0 6px; color: #9aa8b5; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  #kelola .kelompok { margin-top: 18px; }
  #kelola .kelompok h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #9aa8b5; }
  #kelola .baris { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #2a3642; flex-wrap: wrap; }
  #kelola .baris .nama { flex: 1; min-width: 160px; }
  #kelola .baris .nama b { display: block; font-size: 18px; }
  #kelola .baris .nama small { color: #9aa8b5; font-size: 13px; }

    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (r.ok && (await r.json()).iv !== ivData) return pitaBaru("data");
    const tag = await tandaHalaman();
    if (tagHalaman && tag && tag !== tagHalaman) pitaBaru("tampilan");
  } catch (e) { /* jaringan HP putus sebentar: coba lagi menit berikutnya */ }
}

function pitaBaru(jenis) {

    : `<span>${ikon("awas")} Ada tampilan baru. Sandi perlu diketik lagi.</span><button onclick="location.reload()">Muat tampilan baru</button>`;

}

async function perbarui() {
  if (sedangMemperbarui) return;
  sedangMemperbarui = true;
  const gulir = window.scrollY;
  document.querySelectorAll(".tombol-perbarui").forEach(b => { b.disabled = true; b.textContent = "Memperbarui…"; });
  try {
    data = await buka(sandiAktif); siapkan();
    layar === "utama" ? tampil() : menu(cabangMenu);
    window.scrollTo(0, gulir);
    $("#pitaBaru").hidden = true;
    kabar(`Data terbaru sudah ditampilkan (per ${waktuData()}).`);
  } catch (e) {
    if (e.message.startsWith("Sandi salah")) {   // sandi diganti Joe: data baru tidak bisa dibuka dengan sandi lama
      kabar("Sandi sudah diganti. Tekan Muat tampilan baru, lalu ketik sandi baru.");
      pitaBaru("tampilan");
    } else kabar("Gagal memperbarui. Periksa sinyal internet, lalu coba lagi.");
    document.querySelectorAll(".tombol-perbarui").forEach(b => { b.disabled = false; b.textContent = "Perbarui data"; });
  } finally { sedangMemperbarui = false; }
}

// Lampu: merah > 5% DO perlu dicek, kuning > 1%, selain itu hijau
function lampu(perlu, jumlah) {
  const persen = jumlah ? perlu / jumlah * 100 : 0;
  if (persen > 5) return ["merah", "Banyak yang perlu dicek"];
  if (persen > 1) return ["kuning", "Ada yang perlu dicek"];
  return ["hijau", "Aman"];
}

// Jumlahkan baris per_gudang menjadi satu kelompok (cabang atau gudang)
function jumlahkan(baris, label) {
  const k = {nama: label, do: 0, OK: 0};
  Object.keys(STATUS).forEach(s => k[s] = 0);
  for (const g of baris) { k.do += g.do; k.OK += g.OK || 0; Object.keys(STATUS).forEach(s => k[s] += g[s] || 0); }
  k.perlu = PERLU.reduce((a, s) => a + k[s], 0);
  k.beres = k.OK + k["BEDA BULAN SCAN"];
  return k;
}

function daftarCabang() {
  const per = {};
  for (const g of data.per_gudang) (per[g.cabang] ||= []).push(g);
  return Object.entries(per).map(([c, baris]) => ({...jumlahkan(baris, nama(c)), cabang: c, jmlGudang: baris.length}))
    .sort((a, b) => a.cabang < b.cabang ? -1 : 1);
}

const cocok = b => b.cabang === pilih.cabang && b.gudang === pilih.gudang;

// Kartu cabang / gudang gaya Svarna Dipa: nama rata atas-tengah, keterangan di dasar kartu.
// Kartu cabang hanya nama (angka gudang ada di dalam); kartu gudang menampilkan % beres (arahan Joe 27 Okt 2026).
function kotak(k, ikonNama, onclick, dipilih, lanjut) {
  const angka = ikonNama === "gudang" && k.do ? `<div class="nilai">${Math.floor(k.beres / k.do * 100)}<span>% beres</span></div>` : "";

  return `<button class="cab${dipilih ? " dipilih" : ""}" onclick="${onclick}" aria-label="${esc(k.nama)}, ${esc(lanjut)}">

// Merek SVARNA DIPA raksasa; lingkaran cahaya (--sorot-x) mengikuti mouse kiri-kanan, mengejar dengan halus
function merekRaksasa() {
  return `<div class="merek-raksasa" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2468.89 283.47" preserveAspectRatio="none" fill="currentColor">
    <text x="0" y="273" font-size="380" textLength="2468.89" lengthAdjust="spacingAndGlyphs" filter="url(#derauMerek)">SVARNA DIPA</text></svg></div>`;
}
let mouseX = null, sorotKini = 0;
document.addEventListener("mousemove", e => { mouseX = e.clientX; });
(function gerakSorot() {
  if (mouseX !== null) {
    for (const el of document.querySelectorAll(".merek-raksasa")) {
      const r = el.getBoundingClientRect();
      if (!r.width) continue;
      const tujuan = Math.min(100, Math.max(0, (mouseX - r.left) / r.width * 100));
      sorotKini += (tujuan - sorotKini) * .12;
      el.style.setProperty("--sorot-x", sorotKini.toFixed(2) + "%");
    }
  }
  requestAnimationFrame(gerakSorot);
})();

function catatAlamat(h) { if (location.hash.slice(1) !== h) history.pushState(null, "", "#" + h); }
function bukaDariAlamat() {
  const h = decodeURIComponent(location.hash.slice(1));

    if (data.per_gudang.some(g => g.cabang === cabang && g.gudang === gudang)) { masuk(cabang, gudang); return; }
  }
  if (h.startsWith("cabang-") && data.per_gudang.some(g => g.cabang === h.slice(7))) { menu(h.slice(7)); return; }
  menu(null);
}

// ---------- CONTROL AKTIVITAS KELUAR BARANG HARIAN (Joe 31 Okt 2026) ----------
// Arah kontrol (Joe 31 Okt 2026: "dibalik"): mulai dari yang DI-SCAN keluar di WMS (barang, jumlah, gudang) lalu
// dicocokkan ke DO Accurate dengan nomor yang sama: barang, jumlah per barang, dan gudang harus sama.
// DO Accurate yang belum di-scan hanya catatan di bawah. Data: data.harian (bot, 14 hari terakhir), item per (gudang, kode).
let hariPilih = null, harianBuka = new Set();
const cocokH = b => b.c === pilih.cabang && b.g === pilih.gudang;
const URUT_HASIL = {merah: 0, abu: 1, hijau: 2};   // yang tidak cocok di atas
function hasilHarian(b) {
  if (b.s === "RINCIAN ACCURATE BELUM DIAMBIL") return {w: "abu", teks: "Rincian Accurate belum diambil"};   // audit BRO: jangan tampil "berbeda"
  if (!b.ta) return {w: "merah", teks: b.s === "DO DIHAPUS DI ACCURATE" ? "DO dihapus di Accurate" : "Nomor DO tidak ada di Accurate"};
  const beda = b.i.filter(x => Math.abs(x[2] - x[3]) > 1e-9);
  if (!beda.length) return {w: "hijau", teks: "Cocok"};
  const perKode = {};
  for (const x of b.i) { const k = perKode[x[0]] ||= [0, 0]; k[0] += x[2]; k[1] += x[3]; }
  if (Object.values(perKode).every(k => Math.abs(k[0] - k[1]) < 1e-9)) return {w: "merah", teks: "Gudang scan berbeda"};
  if (beda.some(x => x[3] && !x[2])) return {w: "merah", teks: "Barang di-scan tidak ada di DO"};
  if (beda.some(x => !x[3] && x[2])) return {w: "merah", teks: "Barang di DO tidak di-scan"};
  return {w: "merah", teks: "Jumlah scan berbeda"};
}
function bagianHarian() {
  const semua = (data.harian || []).filter(cocokH);
  if (!semua.length) return "";
  const hari = [...new Set(semua.map(b => b.h))].sort().reverse();
  if (!hari.includes(hariPilih)) hariPilih = hari[0];
  return `<h2 id="judulHarian">Control Aktivitas Keluar Barang Harian</h2>
    <div class="redup">Dimulai dari barang yang di-scan keluar di WMS, lalu dicocokkan ke DO Accurate yang nomornya sama: barangnya sama,
      jumlah per barang sama, dan gudang scan sama dengan gudang di DO. Tanggal = hari barang di-scan keluar.</div>
    <div class="pilihan"><select id="fHari" aria-label="Pilih tanggal">${hari.map(x => `<option value="${x}">${tgl(x)}</option>`).join("")}</select></div>
    <div id="harian"></div>`;
}
function bukaHarian(nomor) { harianBuka.has(nomor) ? harianBuka.delete(nomor) : harianBuka.add(nomor); isiHarian(); }
function isiHarian() {
  const hariIni = (data.harian || []).filter(b => cocokH(b) && b.h === hariPilih);
  const baris = hariIni.filter(b => b.ts).map(b => ({...b, hasil: hasilHarian(b)}))
    .sort((a, b) => (URUT_HASIL[a.hasil.w] - URUT_HASIL[b.hasil.w]) || (a.ts < b.ts ? -1 : 1));
  const belum = hariIni.filter(b => b.ta && !b.ts);
  const hitung = w => baris.filter(b => b.hasil.w === w).length;
  const qty = (b, i) => b.i.reduce((s, x) => s + x[i], 0);
  let h = `<div class="angka-kecil" style="margin:10px 0 14px">
      <div style="${gaya("abu")}"><b>${fmt(baris.length)}</b>DO di-scan keluar</div>
      <div style="${gaya("abu")}"><b>${fmt(baris.reduce((s, b) => s + qty(b, 3), 0))}</b>Unit di-scan</div>
      <div style="${gaya("hijau")}"><b>${fmt(hitung("hijau"))}</b>Cocok dengan Accurate</div>
      <div style="${gaya("merah")}" title="Barang/jumlah/gudang berbeda, atau nomor DO tidak ada / dihapus di Accurate"><b>${fmt(hitung("merah"))}</b>Tidak cocok<small style="display:block;text-transform:none;letter-spacing:0">barang/jumlah/gudang berbeda, atau DO tidak ada di Accurate</small></div></div>`;
  h += `<div class="gulir"><table><thead><tr><th>Nomor DO (scan)</th><th>Jam scan WMS</th><th class="n">Jumlah scan</th><th class="n">Jumlah di DO Accurate</th>
      <th>Toko (Accurate)</th><th>Tgl DO Accurate</th><th>Hasil</th></tr></thead><tbody>
    ${baris.map(b => {
      const buka = harianBuka.has(b.n);
      return `<tr style="cursor:pointer" data-nomor="${esc(b.n)}" onclick="bukaHarian(this.dataset.nomor)">
        <td><b>${esc(b.n)}</b></td><td>${esc(b.ts.slice(0, 16))}</td><td class="n">${fmt(qty(b, 3))}</td><td class="n">${b.ta ? fmt(qty(b, 2)) : "–"}</td>
        <td>${esc(b.cu || "–")}</td><td>${b.ta ? tgl(b.ta) : "–"}</td>
        <td><span class="status-pil" style="${gaya(b.hasil.w)}">${ikon(b.hasil.w === "hijau" ? "cek" : "awas")} ${esc(b.hasil.teks)}</span> <span class="redup">${buka ? "▲" : "▼"}</span></td></tr>`
        + (buka ? `<tr><td colspan="7"><table><thead><tr><th>Barang</th><th>Gudang</th><th class="n">Di-scan WMS</th><th class="n">Di DO Accurate</th><th class="n">Selisih (scan − DO)</th><th></th></tr></thead><tbody>
          ${b.i.map(x => `<tr><td>${esc(x[1])} <span class="redup">(${esc(x[0])})</span></td><td>${esc(x[4] || "–")}</td><td class="n">${fmt(x[3])}</td><td class="n">${fmt(x[2])}</td>
            <td class="n">${fmt(x[3] - x[2])}</td><td>${Math.abs(x[2] - x[3]) > 1e-9 ? `<span style="color:var(--merah)">✗ beda</span>` : `<span style="color:var(--hijau)">✓ sama</span>`}</td></tr>`).join("")}
          </tbody></table></td></tr>` : "");
    }).join("") || `<tr><td colspan="7" class="redup">Tidak ada barang di-scan keluar pada tanggal ini.</td></tr>`}
    </tbody></table></div>`;
  if (belum.length) h += `<details><summary>Catatan: ${fmt(belum.length)} DO Accurate tanggal ini belum di-scan keluar</summary><div class="gulir"><table>
    <thead><tr><th>Nomor DO</th><th>Toko</th><th class="n">Jumlah di DO</th></tr></thead><tbody>
    ${belum.map(b => `<tr><td>${esc(b.n)}</td><td>${esc(b.cu || "–")}</td><td class="n">${fmt(qty(b, 2))}</td></tr>`).join("")}</tbody></table></div></details>`;
  $("#harian").innerHTML = h;
}


function lihat(status) {
  $("#fStatus").value = status || "perlu"; $("#fCari").value = "";
  halamanKe = 0; daftar();
  $("#judulDaftar").scrollIntoView({behavior: "smooth"});
}

function bukaTutup(nomor) { terbuka.has(nomor) ? terbuka.delete(nomor) : terbuka.add(nomor); daftar(); }

function kalimatMasalah(b) {
  let t = (STATUS[b.status] || {pendek: b.status}).pendek;
  if (b.status === "BELUM SCAN >= 1 BULAN" && b.tgl_accurate) t += ` (DO sudah ${fmt(umurHari(b.tgl_accurate))} hari)`;
  if (b.status === "BEDA ITEM/QTY") t += b.qty_accurate === b.qty_wms
    ? `: jumlahnya sama (${fmt(b.qty_wms)}), tetapi jenis barangnya berbeda`
    : `: di DO ${fmt(b.qty_accurate)} barang, di-scan ${fmt(b.qty_wms)} barang`;
  if (b.status === "BEDA BULAN SCAN") t += `: DO ${tgl(b.tgl_accurate)}, di-scan ${tgl(b.tgl_scan)}`;
  return t;
}

// DO gudang terpilih sesuai saringan di layar (dipakai daftar di layar dan Unduh Excel)
function saringDo() {
  const s = $("#fStatus").value, q = $("#fCari").value.trim().toUpperCase();
  const baris = data.do_bermasalah.filter(b => cocok(b)
    && (s === "perlu" ? STATUS[b.status]?.perlu : (!s || b.status === s))
    && (!q || [b.nomor, b.customer].some(v => String(v || "").toUpperCase().includes(q))
        || (itemPerDo[b.nomor] || []).some(it => String(it.kode || "").toUpperCase().includes(q))));
  // Yang paling lama di atas (DO tanpa tanggal Accurate memakai tanggal scan)
  baris.sort((a, b) => (a.tgl_accurate || a.tgl_scan || "") < (b.tgl_accurate || b.tgl_scan || "") ? -1 : 1);
  const label = s === "perlu" ? "yang perlu dicek" : s ? `"${STATUS[s].pendek}"` : "bermasalah (merah + kuning)";
  return {baris, label, s, q};
}

function daftar() {
  const {baris, label, s, q} = saringDo();
  const jml = baris.length, maksHal = Math.max(0, Math.ceil(jml / PER_HALAMAN) - 1);
  halamanKe = Math.min(halamanKe, maksHal);
  $("#kalimat").textContent = `Ada ${fmt(jml)} DO ${label} di Gudang ${nama(pilih.gudang)}${q ? ` dengan kata "${$("#fCari").value.trim()}"` : ""}.`
    + (jml ? " Yang paling lama ada di atas." : "");
  let h = baris.slice(halamanKe * PER_HALAMAN, (halamanKe + 1) * PER_HALAMAN).map(b => {
    const st = STATUS[b.status] || {w: "abu"};
    const items = itemPerDo[b.nomor] || [];
    const rinci = `<div class="redup">${b.tgl_scan ? `Di-scan ${tgl(b.tgl_scan)}` : "Belum ada scan"}${b.picking ? ` · nomor picking ${esc(b.picking)}` : ""}</div>
      ${b.keterangan ? `<div style="margin-top:4px">Catatan: ${esc(b.keterangan)}</div>` : ""}
      ${items.length ? `<div class="gulir"><table><thead><tr><th>Barang</th><th class="n">DO Accurate</th><th class="n">Scan WMS</th><th class="n">Selisih</th></tr></thead><tbody>
        ${items.map(it => `<tr><td>${esc(it.nama)} <span class="redup">(${esc(it.kode)})</span></td><td class="n">${fmt(it.qty_accurate)}</td><td class="n">${fmt(it.qty_wms)}</td><td class="n">${fmt(it.selisih)}</td></tr>`).join("")}
        </tbody></table></div>` : ""}`;
    const buka = terbuka.has(b.nomor);
    return `<div class="do${buka ? " buka" : ""}" style="${gaya(st.w)}" data-nomor="${esc(b.nomor)}" onclick="bukaTutup(this.dataset.nomor)">
      <div class="atas"><span class="nomor">${esc(b.nomor)}</span><span class="redup">${b.tgl_accurate ? "DO " + tgl(b.tgl_accurate) : "belum ada DO"}</span></div>
      ${b.customer ? `<div class="toko">${esc(b.customer)}</div>` : ""}
      <div class="tanda">${esc(kalimatMasalah(b))}</div>
      <div class="rinci">${rinci}
        ${data.tautan_grup ? `<a class="tanya-wa" href="#" data-teks="${esc(salamWa() + `Saya mau bertanya tentang ${b.nomor}: ${kalimatMasalah(b)}. `)}"
          onclick="tanyaBot(event, this.dataset.teks)">${ikon("chat")} Tanya Bot WMS di grup WhatsApp</a>` : ""}</div>
      <div class="buka-teks">${buka ? "Tutup ▲" : "Lihat rincian ▼"}</div></div>`;
  }).join("");
  if (!jml) h = `<div class="kosong">${ikon("cek")} Tidak ada DO yang cocok dengan pilihan ini.</div>`;
  else h += `<div class="halaman"><button class="tipis" ${halamanKe ? "" : "disabled"} onclick="halamanKe--;daftar();$('#judulDaftar').scrollIntoView()">‹ Sebelumnya</button>
    <span class="redup">${fmt(halamanKe * PER_HALAMAN + 1)}–${fmt(Math.min(jml, (halamanKe + 1) * PER_HALAMAN))} dari ${fmt(jml)}</span>
    <button class="tipis" ${halamanKe < maksHal ? "" : "disabled"} onclick="halamanKe++;daftar();$('#judulDaftar').scrollIntoView()">Berikutnya ›</button></div>`;
  $("#daftar").innerHTML = h;
}

// ---------- Unduh Excel satu gudang (permintaan staf gudang, disetujui Joe 27 Okt 2026) ----------
// Pustaka SheetJS 0.18.5 (sama dengan dashboard GIO) dimuat hanya saat tombol ditekan.
// Berkas dibuat di HP/komputer staf sendiri dari data yang sudah terbuka; tidak ada data yang dikirim ke mana pun.
function muatPustakaExcel() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((jadi, gagal) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    // Dikunci SRI (audit BUJANG 27 Okt 2026): bila berkas di CDN berubah, browser menolak memuatnya
    s.integrity = "sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==";
    s.crossOrigin = "anonymous";
    s.referrerPolicy = "no-referrer";
    s.onload = jadi;
    s.onerror = () => gagal(new Error("Excel tidak bisa dibuat. Periksa sinyal internet, lalu coba lagi."));
    document.head.appendChild(s);
  });
}

const tglExcel = s => s ? new Date(s.slice(0, 10) + "T00:00:00") : "";
function lembar(baris, lebar) {
  const ws = XLSX.utils.aoa_to_sheet(baris, {cellDates: true, dateNF: "[$-421]dd mmm yyyy"});   // 421 = bahasa Indonesia (Okt, Agu, Des)
  ws["!cols"] = lebar.map(w => ({wch: w}));
  return ws;
}

async function unduhExcel() {
  const tombol = $("#tombolExcel");
  tombol.disabled = true; tombol.textContent = "Menyiapkan Excel…";
  try {
    await muatPustakaExcel();
    const {baris, label} = saringDo();
    const r = jumlahkan(data.per_gudang.filter(cocok), "Gudang " + pilih.gudang);
    const pendek = b => (STATUS[b.status] || {pendek: b.status}).pendek;
    const ringkasan = [
      ["Kontrol barang keluar gudang: DO Accurate dibandingkan dengan scan WMS"],
      ["Rahasia perusahaan. Hanya untuk pekerjaan gudang; jangan dibagikan kepada pihak luar."],
      ["Cabang", nama(pilih.cabang)], ["Gudang", nama(pilih.gudang)],
      ["Periode", `${tgl(data.periode.mulai)} sampai ${tgl(data.periode.sampai)}`],
      ["Data per", waktuData()], ["Isi sheet Daftar DO", `DO ${label}`], [],
      ["Keterangan", "Jumlah DO"], ["Total DO", r.do], ["Beres", r.beres], ["Perlu dicek", r.perlu],
      ...Object.keys(STATUS).filter(s => r[s]).map(s => [STATUS[s].pendek, r[s]]),
      ["Persen beres", {t: "n", v: r.do ? Math.floor(r.beres / r.do * 100) / 100 : 0, z: "0%"}]];
    const daftarDo = [["Nomor DO", "Tanggal DO", "Toko", "Tanggal scan", "Nomor picking", "Masalah", "Penjelasan", "Catatan", "Jumlah DO Accurate", "Jumlah scan WMS"],
      ...baris.map(b => [b.nomor, tglExcel(b.tgl_accurate), b.customer || "", tglExcel(b.tgl_scan), b.picking || "",
        pendek(b), kalimatMasalah(b), b.keterangan || "", b.qty_accurate ?? "", b.qty_wms ?? ""])];
    const rinci = [["Nomor DO", "Kode barang", "Nama barang", "Jumlah DO Accurate", "Jumlah scan WMS", "Selisih", "Masalah DO"]];
    for (const b of baris) for (const it of itemPerDo[b.nomor] || [])
      rinci.push([b.nomor, it.kode || "", it.nama || "", it.qty_accurate ?? 0, it.qty_wms ?? 0, it.selisih ?? 0, pendek(b)]);
    const akhir = rinci.length;   // baris data terakhir (judul di baris 1)
    rinci.push(["TOTAL", "", "", {t: "n", f: `SUM(D2:D${akhir})`}, {t: "n", f: `SUM(E2:E${akhir})`}, {t: "n", f: `SUM(F2:F${akhir})`}, ""]);
    const buku = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(buku, lembar(ringkasan, [36, 48]), "Ringkasan");
    XLSX.utils.book_append_sheet(buku, lembar(daftarDo, [20, 13, 34, 13, 16, 40, 60, 30, 12, 12]), "Daftar DO");
    XLSX.utils.book_append_sheet(buku, lembar(rinci, [20, 16, 44, 12, 12, 10, 40]), "Rincian barang");
    const namaBerkas = `Kontrol Gudang ${nama(pilih.gudang)} ${data.dibuat.slice(0, 10)} (Staf Gudang).xlsx`;
    XLSX.writeFile(buku, namaBerkas);
    kabar(`Excel sudah diunduh: ${namaBerkas}`);
  } catch (e) {
    kabar(e.message || "Excel gagal dibuat. Coba lagi.");
  } finally {
    tombol.disabled = false; tombol.innerHTML = `${ikon("unduh")} Unduh Excel`;
  }
}

      isi.innerHTML = '<div class="pb-kosong"><b>Belum tersambung</b>Tanya Bot Svarna sedang tidak bisa dihubungi. ' +
        'Periksa sambungan internet, lalu tekan Coba lagi.</div><button class="pb-tombol" type="button" id="pbUlang">Coba lagi</button>';
      $("pbUlang").onclick = async () => { takTerjangkau = false; if (latar) await masukLatar(); layar(); };
      return;
    }
    if (!sesi && khususTailscale) {    // akun penting dari internet publik: hanya boleh lewat Tailscale (server 403)
      isi.innerHTML = '<div class="pb-kosong"><b>Belum tersambung</b>' + esc(khususTailscale) + '</div>' +
        '<button class="pb-tombol" type="button" id="pbUlang">Coba lagi</button>';
      $("pbUlang").onclick = async () => { khususTailscale = ""; if (latar) await masukLatar(); layar(); };
      return;
    }
    if (!sesi) {                       // tanpa form masuk (Joe 30 Okt): masuk hanya lewat sandi modul
      isi.innerHTML = '<div class="pb-kosong"><b>Belum tersambung</b>Sesi Tanya Bot sudah habis. ' +
        'Muat ulang halaman, lalu masukkan sandi modul lagi.</div><button class="pb-tombol" type="button" id="pbMuat">Muat ulang</button>';
      $("pbMuat").onclick = () => location.reload();
      return;
    }
    $("pbSiapa").textContent = (sesi.nama || "") + (sesi.ai ? " · " + sesi.ai : "");
    $("pbBawah").hidden = false;
    if (!riwayat.length) { tambah("pb-kosong", "<b>" + esc(sesi.ai || "AI Svarna") + "</b>Ada yang bisa dibantu?<br>Bot ikut membaca layar yang sedang dibuka."); if (pakaiHistori) muatHistori(); }
    else for (const m of riwayat) tambah(m.dari === "saya" ? "pb-saya" : "pb-ai", m.dari === "saya" ? esc(m.teks) : md(m.teks));
    $("pbTeks").focus();
  }
  // Histori tanya-jawab dari layanan chat (POST /api/histori; peran joe melihat semua akun, lainnya hanya miliknya).
  async function muatHistori() {
    try { const r = await fetch(API + "/api/histori", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sesi.token },
        body: JSON.stringify({ batas: 50 }) });
      if (r.status === 401) { simpanSesi(null); if (await masukLatar()) return muatHistori(); layar(); return; }
      if (!r.ok) return;              // layanan versi lama (belum ada /api/histori): panel tetap jalan tanpa histori
      const daftar = ((await r.json().catch(() => ({}))).histori || []).filter((h) => h.status === "ok" && h.tanya);
      if (!daftar.length || riwayat.length || sibuk) return;
      isi.innerHTML = ""; let hari = "";
      for (const h of daftar) {
        const w = String(h.waktu || ""), tgl = w.slice(0, 10);
        if (tgl && tgl !== hari) { hari = tgl; tambah("pb-waktu", esc(tgl)); }
        const siapa = h.akun && h.akun !== sesi.akun ? "<b>" + esc(h.akun) + "</b> · " : "";
        tambah("pb-saya", esc(h.tanya)); tambah("pb-ai", md(h.jawab || "") + '<div class="pb-ket" style="text-align:left;margin-top:4px">' + siapa + esc(w.slice(11, 16)) + "</div>");
      }
      tambah("pb-garis", "Percakapan baru di bawah ini");
    } catch (e) { /* histori gagal dimuat: obrolan baru tetap bisa */ }
  }
  // Layar yang sedang dibuka penanya (Joe 30 Okt): filter terpilih + teks yang tampil, tanpa panel chat dan layar sandi.
  // Diambil saat tombol kirim ditekan supaya selalu yang terbaru. Pilihan dropdown disembunyikan sebentar saat dibaca
  // supaya yang terkirim hanya nilai terpilih, bukan seluruh daftar opsi.
  function bacaLayar() {
    const lewati = new Set(["panelBot", "gerbang", "tombolBot", "pita-isian", "masuk", "kabar", "pitaBaru"]);
    const bagian = [...document.body.children].filter((el) => !lewati.has(el.id) && !/^(SCRIPT|STYLE|TEMPLATE|NOSCRIPT)$/.test(el.tagName));
    const filter = [];
    for (const s of document.querySelectorAll("select")) {
      if (s.closest("#panelBot, #gerbang") || !s.offsetParent) continue;
      const label = (s.labels && s.labels[0] && s.labels[0].innerText) || s.getAttribute("aria-label") || s.name || s.id || "Pilihan";
      const pilih = s.selectedOptions[0];
      filter.push(label.trim() + ": " + (pilih ? pilih.text.trim() : s.value));
    }
    const pilihan = [...document.querySelectorAll("select")].filter((s) => !s.closest("#panelBot"));
    const semula = pilihan.map((s) => s.style.display);
    pilihan.forEach((s) => { s.style.display = "none"; });
    let isiLayar = "";
    try { isiLayar = bagian.map((el) => el.innerText || "").join("\n").replace(/\n{3,}/g, "\n\n").trim(); }
    finally { pilihan.forEach((s, i) => { s.style.display = semula[i]; }); }
    const judul = [...document.querySelectorAll("h1, h2")].find((h) => !h.closest("#panelBot, #gerbang") && h.offsetParent);
    return { modul: document.title || "", judul: judul ? judul.innerText.trim() : "", alamat: location.pathname + location.hash,
      teks: ((filter.length ? "Filter terpilih:\n" + filter.join("\n") + "\n\n" : "") + isiLayar).slice(0, 40000) };
  }
  async function kirim(ev) {
    ev.preventDefault(); const teks = $("pbTeks").value.trim(); if (!teks || sibuk) return;
    if (!riwayat.length && !isi.querySelector(".pb-garis")) isi.innerHTML = "";
    sibuk = true; $("pbKirim").disabled = true; $("pbTeks").value = "";
    tambah("pb-saya", esc(teks)); const tunggu = tambah("pb-ai pb-tunggu", "Sedang berpikir...");
    const tanya = () => fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sesi.token },
        body: JSON.stringify({ pesan: teks, riwayat, layar: bacaLayar() }) });
    try { let r = await tanya();
      if (r.status === 401) { simpanSesi(null); if (await masukLatar()) r = await tanya(); }
      if (r.status === 401) { simpanSesi(null); tunggu.remove(); layar(); return; }
      const j = await r.json().catch(() => ({}));
      tunggu.classList.remove("pb-tunggu");
      if (j.status === "ok") { tunggu.innerHTML = md(j.jawab || ""); riwayat.push({ dari: "saya", teks }, { dari: "ai", teks: j.jawab || "" }); }
      else tunggu.innerHTML = '<span class="pb-galat">' + esc(j.jawab || j.galat || (j.status === "kuota" ? "Kapasitas sedang penuh, coba lagi nanti." : "Bot belum bisa menjawab, coba lagi.")) + "</span>";
    } catch (e) { tunggu.innerHTML = '<span class="pb-galat">Belum tersambung. Periksa sambungan internet, lalu kirim ulang.</span>'; }
    finally { sibuk = false; $("pbKirim").disabled = false; }
  }
  const buka = (y) => { document.body.classList.toggle("panel-bot-buka", y); $("panelBot").setAttribute("aria-hidden", y ? "false" : "true"); if (y) (janjiLatar || Promise.resolve()).then(layar); };
  $("tombolBot").onclick = () => buka(true);
  $("pbTutup").onclick = () => buka(false);
  $("pbBaru").onclick = () => { riwayat = []; pakaiHistori = false; layar(); pakaiHistori = true; };
  $("pbKeluar").onclick = async () => { if (sesi && API) try { await fetch(API + "/api/keluar", { method: "POST",
      headers: { "Authorization": "Bearer " + sesi.token, "Content-Type": "application/json" }, body: "{}" }); } catch (e) {}
    latar = null; simpanSesi(null); riwayat = []; layar(); };
  $("pbForm").onsubmit = kirim;
  $("pbTeks").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("pbForm").requestSubmit(); } });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("panel-bot-buka")) buka(false); });
})();
</script>
<style>
/* Tanya Bot Svarna di Panel Gudang (BEN 30 Okt 2026): tampil setelah sandi benar; tombol bawaan halaman ini tidak
   ikut mengubah tombol di dalam panel */
#tombolBot { display: none; }
body.bot-siap:not(.panel-bot-buka) #tombolBot { display: flex; }
#panelBot button { text-transform: none; letter-spacing: normal; }
#panelBot .pb-kirim { padding: 0; }
#panelBot .pb-kirim:hover { background: #6fb3d2; color: #11171d; }
#panelBot button.pb-ikon:hover { background: none; }
#panelBot .pb-tombol { text-transform: uppercase; letter-spacing: .1em; }
</style>
</body>
</html>
