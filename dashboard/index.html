<style>
/* Layout: header buku besar (judul + pilihan bulan/cabang), baris tab, lalu kartu angka dan tabel per tab. */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --fg: #16202b;
  --muted: #5b6876;
  --line: #dde3ea;
  --accent: #1d5c78;
  --accent-soft: #e3eef3;
  --ok: #1f7a4d;
  --warn: #9a6200;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --warn-soft: #fdf1dc;
  --ok-soft: #e4f3ea;
  --bar: #9fc0d0;
  --font-ui: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #18212a; --fg: #e6ecf1; --muted: #9aa8b5; --line: #2a3642;
    --accent: #6fb3d2; --accent-soft: #1d3240; --ok: #5cc28d; --warn: #e0a84a; --bad: #f08a80;
    --bad-soft: #3a2220; --warn-soft: #3a2f1c; --ok-soft: #1c3428; --bar: #3f6b80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --fg: #e6ecf1; --muted: #9aa8b5; --line: #2a3642;
  --accent: #6fb3d2; --accent-soft: #1d3240; --ok: #5cc28d; --warn: #e0a84a; --bad: #f08a80;
  --bad-soft: #3a2220; --warn-soft: #3a2f1c; --ok-soft: #1c3428; --bar: #3f6b80;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1280px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
header.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
label.ctl { display: grid; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
select, input, textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--muted); padding: 9px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover { color: var(--fg); }
section.page { display: grid; gap: 16px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-num); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .n { font-size: 12.5px; color: var(--muted); }
.up { color: var(--ok); } .down { color: var(--bad); } .warn { color: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card h2 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
.card .note { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 75ch; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.tbl-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 9px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; z-index: 1; cursor: pointer; user-select: none; white-space: nowrap; }
th[aria-sort="ascending"]::after { content: " ▲"; } th[aria-sort="descending"]::after { content: " ▼"; }
td.num, th.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num { font-family: var(--font-ui); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.bar-cell { position: relative; }
.bar-cell .b { position: absolute; inset: 4px auto 4px 0; background: var(--accent-soft); border-radius: 3px; z-index: 0; }
.bar-cell span { position: relative; z-index: 1; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.mut { background: var(--accent-soft); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
button.btn { appearance: none; font: inherit; font-weight: 600; font-size: 13px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
button.btn:disabled { opacity: .5; cursor: default; }
.formgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.formgrid label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
.formgrid .wide { grid-column: 1 / -1; }
input.tgt { width: 9.5em; text-align: right; font-family: var(--font-num); padding: 3px 6px; }
    input.cat { width: 20em; max-width: 46vw; padding: 3px 6px; }
.chart { width: 100%; min-height: 220px; position: relative; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; z-index: 5; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
.msg { font-size: 13px; padding: 8px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.muted { color: var(--muted); }
details.detail summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--accent); }
.mono { font-family: var(--font-num); font-size: 12.5px; }
@media (max-width: 520px) { .kpi .v { font-size: 19px; } header.top h1 { font-size: 19px; } }
</style>

<script type="text/plain" id="gio-utama">
(() => {
  "use strict";
  // ---------- util tampilan ----------
  const $ = (s, r = document) => r.querySelector(s);
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
    return e;
  }
  const nf0 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  const rp = (x) => "Rp " + nf0.format(Math.round(x || 0));
  function rpK(x) { // ringkas: jt / M
    const a = Math.abs(x || 0), s = x < 0 ? "-" : "";
    if (a >= 1e9) return s + "Rp " + nf1.format(a / 1e9).replace(/,0$/, "") + " M";
    if (a >= 1e6) return s + "Rp " + nf1.format(a / 1e6).replace(/,0$/, "") + " jt";
    return s + "Rp " + nf0.format(a);
  }
  const pct = (x) => (x == null || !isFinite(x)) ? "–" : nf1.format(x * 100) + "%";
  const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const namaBulan = (m) => { const [y, b] = m.split("-"); return BLN[+b - 1] + " " + y; };
  const sum = (rows, f) => rows.reduce((a, r) => a + (+r[f] || 0), 0);
  function groupSum(rows, keyFn, fields) {
    const m = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      let a = m.get(k); if (!a) { a = { key: k }; for (const f of fields) a[f] = 0; m.set(k, a); }
      for (const f of fields) a[f] += +r[f] || 0;
    }
    return [...m.values()];
  }

  // tabel yang bisa diurutkan: cols = [{h, f (row=>value), num, fmt, bar, cls}]
  function table(cols, rows, opts = {}) {
    const wrap = el("div", { class: "tbl-wrap", style: opts.maxH ? "max-height:" + opts.maxH : null });
    const t = el("table");
    const thead = el("thead"), tb = el("tbody");
    let sortI = opts.sort ?? -1, dir = opts.dir || "desc", urut = rows, batas = opts.limit || 0;
    // tabel panjang ditampilkan bertahap; tombol di bawah tabel menambah barisnya
    const kaki = el("div", { class: "row", style: "gap:8px;align-items:center;margin-top:6px" });
    const trh = el("tr");
    cols.forEach((c, i) => {
      const th = el("th", { class: c.num ? "num" : null, scope: "col", text: c.h, tabindex: "0" });
      const act = () => { if (sortI === i) dir = dir === "asc" ? "desc" : "asc"; else { sortI = i; dir = c.num ? "desc" : "asc"; } draw(); };
      th.addEventListener("click", act);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter") act(); });
      trh.append(th);
    });
    thead.append(trh);
    const maxBar = {};
    cols.forEach((c, i) => { if (c.bar) maxBar[i] = Math.max(1, ...rows.map((r) => Math.abs(+c.f(r) || 0))); });
    function draw() {
      [...trh.children].forEach((th, i) => th.setAttribute("aria-sort", i === sortI ? (dir === "asc" ? "ascending" : "descending") : "none"));
      const rs = rows.slice();
      if (sortI >= 0) {
        const c = cols[sortI];
        rs.sort((a, b) => { const x = c.f(a), y = c.f(b); const r = c.num ? (x || 0) - (y || 0) : String(x ?? "").localeCompare(String(y ?? ""), "id"); return dir === "asc" ? r : -r; });
      }
      tb.replaceChildren();
      urut = rs;
      const lim = batas ? rs.slice(0, batas) : rs;
      for (const r of lim) {
        const tr = el("tr", { class: opts.onRow ? "click" : null });
        if (opts.onRow) tr.addEventListener("click", () => opts.onRow(r));
        cols.forEach((c, i) => {
          const v = c.f(r);
          const td = el("td", { class: [c.num ? "num" : "", c.bar ? "bar-cell" : "", c.cls || ""].join(" ").trim() || null });
          const shown = c.node ? c.node(r) : (c.fmt ? c.fmt(v, r) : (v ?? ""));
          if (c.bar) { td.append(el("div", { class: "b", style: "width:" + Math.min(100, Math.abs(+v || 0) / maxBar[i] * 100) + "%" }), el("span", null, shown)); }
          else td.append(shown instanceof Node ? shown : String(shown));
          tr.append(td);
        });
        tb.append(tr);
      }
      if (opts.total) {
        const tr = el("tr", { class: "total" });
        cols.forEach((c, i) => tr.append(el("td", { class: c.num ? "num" : null }, opts.total[i] ?? "")));
        tb.append(tr);
      }
      if (!rows.length) tb.append(el("tr", null, el("td", { colspan: cols.length, class: "empty", text: opts.empty || "Tidak ada data untuk pilihan ini." })));
      kaki.replaceChildren();
      if (batas && rows.length > batas) {
        const tambah = (n) => { batas = n ? Math.min(rows.length, batas + n) : 0; draw(); };
        kaki.append(el("span", { class: "note", style: "margin:0", text: "Menampilkan " + nf0.format(batas) + " dari " + nf0.format(rows.length) + " baris teratas sesuai urutan." }),
          el("button", { class: "btn ghost", type: "button", style: "padding:3px 10px;font-size:12px", onclick: () => tambah(opts.limit) }, "Tampilkan " + nf0.format(Math.min(opts.limit, rows.length - batas)) + " baris lagi"),
          el("button", { class: "btn ghost", type: "button", style: "padding:3px 10px;font-size:12px", onclick: () => tambah(0) }, "Tampilkan semua"),
          el("span", { class: "muted", style: "font-size:12px", text: "Unduh Excel berisi semua baris." }));
      }
    }
    draw();
    t.append(thead, tb); wrap.append(t);
    const pesan = el("span", { class: "muted", style: "font-size:12px" });
    const tombol = el("button", { class: "btn ghost", type: "button", style: "padding:3px 10px;font-size:12px", title: "Semua baris tabel ini, sesuai pilihan bulan/cabang/sales dan urutan saat ini" }, "Unduh Excel");
    tombol.addEventListener("click", () => unduhExcel(cols, urut, wrap, tombol, pesan));
    const bar = rows.length ? el("div", { class: "row", style: "gap:8px;align-items:center;justify-content:flex-end;margin:0 0 6px" }, pesan, tombol) : null;
    if (opts.limit && rows.length > opts.limit) return el("div", null, bar, wrap, kaki);
    return bar ? el("div", null, bar, wrap) : wrap;
  }

  // ---------- unduh Excel (SheetJS dimuat saat tombol pertama kali diklik) ----------
  let xlsxSiap = null;
  const muatXlsx = () => xlsxSiap || (xlsxSiap = new Promise((ok, gagal) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxSiap = null; gagal(new Error("muat")); };
    document.head.append(s);
  }));
  async function unduhExcel(cols, rows, wrap, tombol, pesan) {
    const judul = (wrap.closest(".card")?.querySelector("h2")?.textContent || "Dashboard").trim();
    pesan.textContent = "Menyiapkan…"; tombol.disabled = true;
    try {
      const [X, dl] = await Promise.all([muatXlsx(), window.claude ? window.claude.use("downloads") : null]);
      if (!dl) { pesan.textContent = "Unduhan tidak tersedia di tampilan ini - buka halamannya di claude.ai."; return; }
      const aoa = [cols.map((c) => c.h)].concat(rows.map((r) => cols.map((c) => {
        const v = c.f(r);
        return typeof v === "number" ? (isFinite(v) ? v : null) : v == null ? "" : String(v);
      })));
      const info = [["Dashboard", document.title], ["Tabel", judul], ["Data per", D.meta.periode_sampai || ""],
        ["Bulan", S.bulan ? namaBulan(S.bulan) : ""], ["Cabang", S.cabang || "Semua"], ["Sales", S.sales !== "" ? namaSales(S.sales) : "Semua"],
        ["Diunduh", new Date().toLocaleString("id-ID")]];
      const wb = X.utils.book_new(), ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = cols.map((c, i) => ({ wch: Math.min(40, Math.max(c.h.length, ...aoa.slice(1, 200).map((r) => String(r[i] ?? "").length)) + 2) }));
      ws["!autofilter"] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: cols.length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, "Data");
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(info), "Keterangan");
      const buf = X.write(wb, { bookType: "xlsx", type: "array" });
      const nama = (judul + (S.cabang ? " " + S.cabang : "") + " " + (D.meta.periode_sampai || "")).replace(/[\\/:*?"<>|·]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 150) + ".xlsx";
      await dl.save({ filename: nama, data: buf });
      pesan.textContent = "Tersimpan: " + nama;
    } catch (e) {
      pesan.textContent = e && e.code === "declined" ? "Unduhan dibatalkan." : e && e.message === "muat" ? "Gagal memuat pembuat Excel - periksa koneksi internet." : "Gagal mengunduh" + (e && e.code ? " (" + e.code + ")" : "") + ".";
    } finally { tombol.disabled = false; }
  }
  const kpi = (k, v, n, cls) => el("div", { class: "kpi" }, el("div", { class: "k", text: k }), el("div", { class: "v " + (cls || ""), text: v }), n ? (n instanceof Node ? el("div", { class: "n" }, n) : el("div", { class: "n", text: n })) : null);
  const card = (title, note, ...kids) => el("div", { class: "card" }, el("h2", { text: title }), note ? el("p", { class: "note", text: note }) : null, ...kids);

  // ---------- data ----------
  const D = { barang: {}, jual_rugi: {}, pelanggan: {} };
  const S = { bulan: null, cabang: "", sales: "", page: "ringkasan", target: {}, program: [], harga: [], catatan: {}, catatanRetur: {}, fotoRetur: {}, pengajuan: [], programBeli: [], pesanFix: {}, pesanMerk: "", pesanTampil: "pesan", ajuJenis: "", ajuStatus: "aktif", mcp: null, sebab: "nyata", canWrite: null, db: null, uid: null };

  const lazy = {};

  const namaSales = (id) => (D.salesById.get(id) || {}).nama || ("#" + id);

  const filtCab = (r) => !S.cabang || r.cabang === S.cabang;

  const bulanSebelum = (m) => { const i = D.meta.bulan.indexOf(m); return i > 0 ? D.meta.bulan[i - 1] : null; };

  // ---------- aturan bonus ----------
  const BLNK = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, Mei: 5, Jun: 6, Jul: 7, Agu: 8, Sep: 9, Okt: 10, Nov: 11, Des: 12 };
  const acuanKey = (s) => { const [b, y] = String(s || "").split(" "); return (+y || 0) * 100 + (BLNK[b] || 0); };
  function siapkanAturan() {
    D.aturanBySales = new Map();

  }
  function aturanUntuk(sid, brand, cabang) {
    const rs = (D.aturanBySales.get(sid) || []).filter((r) => r.kategori.includes(brand));
    if (!rs.length) return [];
    const max = Math.max(...rs.map((r) => acuanKey(r.bulan_acuan)));
    const byDasar = new Map();
    for (const r of rs.filter((r) => acuanKey(r.bulan_acuan) === max)) {
      const cur = byDasar.get(r.dasar);

  // dasar bonus dihitung sesudah RETUR dikurangkan (nilai tanpa PPN).

  const potongan = (r) => (r.retur || 0);

  // dasar bonus satu baris: kotor = sebelum retur, bersih = yang dikali tarif
  function dasarRow(row, r) {
    switch (r.dasar) {

      case "selisih jual - modal": return { kotor: row.laba_pos || 0, bersih: nLabaPos(row) };

  }

  const DASAR_LBL = {
    "omset (incl. PPN)": ["Omset tanpa PPN", "retur"],
    "selisih jual - modal": ["Laba baris yang untung (jual tanpa PPN − HPP)", "laba barang yang diretur"],
    "omset barang yang dijual di harga modal": ["Omset barang yang dijual ≤ harga modal, ÷ 1,11", ""],
    "total harga modal": ["Total HPP barang terjual", "HPP retur"],

  // bonus per sales untuk satu bulan: [{sales_id, cabang, omset_ppn, laba, bonus, rinci:[{brand, ...}]}]
  function hitungBonus(m) {
    const rows = jualBulan(m).filter((r) => r.sales_id);
    const per = new Map();
    for (const r of rows) {
      let s = per.get(r.sales_id);
      if (!s) { s = { sales_id: r.sales_id, cabang: new Set(), omset_ppn: 0, omset: 0, laba: 0, hpp: 0, rugi: 0, retur: 0, diskon: 0, bonus: 0, tanpaTarif: 0, brand: new Map() }; per.set(r.sales_id, s); }
      s.cabang.add(r.cabang); s.omset_ppn += r.omset_ppn; s.omset += r.omset; s.laba += r.laba; s.hpp += r.hpp; s.rugi += r.rugi; s.retur += r.retur || 0; s.diskon += r.diskon || 0;
      const rules = aturanUntuk(r.sales_id, r.brand, r.cabang_asli || r.cabang); // tarif ikut cabang Accurate asli
      let br = s.brand.get(r.brand);
      if (!br) { br = { brand: r.brand, omset_ppn: 0, omset: 0, laba: 0, laba_pos: 0, omset_le_modal_ppn: 0, hpp: 0, retur: 0, diskon: 0, bonus: 0, aturan: rules, rinci: new Map() }; s.brand.set(r.brand, br); }
      let b = 0;
      for (const a of rules) {
        const d = dasarRow(r, a), k = [a.dasar, a.tarif, a.bulan_acuan, a.cabang].join("|");
        let x = br.rinci.get(k);
        if (!x) br.rinci.set(k, (x = { aturan: a, kotor: 0, bersih: 0, bonus: 0 }));
        x.kotor += d.kotor; x.bersih += d.bersih; x.bonus += a.tarif * d.bersih; b += a.tarif * d.bersih;
      }
      s.bonus += b;
      if (!rules.length) s.tanpaTarif += r.omset_ppn;
      br.omset_ppn += r.omset_ppn; br.omset += r.omset; br.laba += r.laba; br.laba_pos += r.laba_pos; br.omset_le_modal_ppn += r.omset_le_modal_ppn; br.hpp += r.hpp; br.retur += r.retur || 0; br.diskon += r.diskon || 0; br.bonus += b;
    }
    return [...per.values()].map((s) => ({ ...s, cabang: [...s.cabang].join(", "), nama: namaSales(s.sales_id), adaAturan: D.aturanBySales.has(s.sales_id) }));
  }

  // ---------- program & harga spesial ----------
  const bulanDalam = (m, dari, sampai) => { const a = m + "-01", z = m + "-31"; return (!dari || dari <= z) && (!sampai || sampai >= a); };
  // baris program: pelanggan tertentu dihitung dari pelanggan-YYYY-MM.json
  // (per pelanggan per brand), program lain dari barang-YYYY-MM.json (per barang)
  const barisProgram = (p, m) => p.pelanggan ? (D.pelanggan[m] || []) : (D.barang[m] || []);
  const cocokPelanggan = (daftar, nama) => {
    const nm = String(nama || "").toUpperCase();
    return String(daftar).split(",").map((x) => x.trim().toUpperCase()).filter(Boolean)
      .some((x) => nm === x || nm.includes(x));
  };
  function cocokProgram(p, r) {
    if (p.cabang && r.cabang !== p.cabang && r.cabang_asli !== p.cabang) return false;
    if (p.sales_id && r.sales_id !== +p.sales_id) return false;
    if (p.pelanggan && !cocokPelanggan(p.pelanggan, r.pelanggan)) return false;
    if (p.item && r.item) { const list = p.item.split(/[,\s]+/).filter(Boolean).map((x) => x.toUpperCase()); if (!list.includes(String(r.item).toUpperCase())) return false; }
    if (p.brand && (r.item ? brandItem(r.item) : r.brand) !== p.brand) return false;

    else if (p.jenis === "rp_per_unit") est = (+p.nilai || 0) * qty;
    else if (p.jenis === "target") {
      const real = p.target_jenis === "qty" ? qty : dasar;
      progres = (+p.target_nilai || 0) > 0 ? real / +p.target_nilai : null;
      capai = progres != null && progres >= 1;
      const hadiah = p.hadiah_jenis === "persen" ? (+p.hadiah_nilai || 0) / 100 * dasar : (+p.hadiah_nilai || 0);

  function programBulan(m) {

  function chartBatangHari(host, data) {   // data: [{tgl, omset, faktur}]

    const x = (h) => mL + (W - mL - mR) * ((h - 1) / (maxH - 1));

    const hr = D.harian.filter((r) => r.sales_id === s.sales_id && filtCab(r) && r.tgl.slice(0, 7) === m);
    const perHari = groupSum(hr, (r) => r.tgl, ["omset_ppn", "faktur"])
      .sort((a, b) => a.key.localeCompare(b.key))
      .map((g) => ({ tgl: g.key, omset: g.omset_ppn, faktur: g.faktur }));
    host.replaceChildren(el("div", { class: "grid2" },
      card("Akumulasi bulanan · " + s.nama, "Batang muda omset tanpa PPN, batang tua laba kotor — untuk melihat naik turunnya sepanjang tahun.", chB),
      card("Harian · " + s.nama + " · " + namaBulan(m), null, chD)));
    requestAnimationFrame(() => { chartBulanan(chB, perBulan); chartBatangHari(chD, perHari); });
    host.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // isi kolom Est. bonus: perhitungannya dijabarkan per brand (dasar bonus x tarif = bonus)

    ];
    let no = 1;
    if (s.rinciHarga.length) kids.push(

    if (s.rinciProgram.length) kids.push(

      table([

  // sebab jual rugi - supaya daftarnya bisa disaring; baris berharga nol itu barang

  const SARING_LBL = { semua: "Semua baris", tanpa_nol: "Tanpa baris berharga nol", nyata: "Hanya rugi nyata (> 1% HPP)", berat: "Hanya rugi berat (> 20% HPP)" };

  // ---- slow moving: cara skill analisa-slow-moving ----
  const STATUS = ["MATI - 0 TERJUAL", "SANGAT LAMBAT", "LAMBAT", "PERLU DIPANTAU", "NORMAL", "TIDAK ADA STOK"];
  const STATUS_KELAS = { "MATI - 0 TERJUAL": "bad", "SANGAT LAMBAT": "bad", "LAMBAT": "warn", "PERLU DIPANTAU": "warn", "NORMAL": "ok", "TIDAK ADA STOK": "mut" };
  const bermasalah = (r) => r.status === "MATI - 0 TERJUAL" || r.status === "SANGAT LAMBAT";
  function slowFilter() { return (D.slow_moving || []).filter((r) => (!S.cabang || r.cabang === S.cabang) && (!S.merk || brandItem(r.item) === S.merk) && (!S.status || r.status === S.status)); }
  function ringkasSlow(rows, keyFn) {
    const m = new Map();
    for (const r of rows) {
      const k = keyFn(r);
      let a = m.get(k); if (!a) { a = { key: k, nilai: 0, mati: 0, sl: 0, l: 0 }; m.set(k, a); }
      a.nilai += r.nilai;
      if (r.status === "MATI - 0 TERJUAL") a.mati += r.nilai;
      else if (r.status === "SANGAT LAMBAT") a.sl += r.nilai;
      else if (r.status === "LAMBAT") a.l += r.nilai;
    }
    return [...m.values()];
  }
  const colsRingkas = (lbl) => [
    { h: lbl, f: (r) => r.key },
    { h: "Nilai stok", f: (r) => r.nilai, num: true, fmt: rpK },

    { h: "Sangat lambat", f: (r) => r.sl, num: true, fmt: (v) => v ? rpK(v) : "–" },
    { h: "Lambat", f: (r) => r.l, num: true, fmt: (v) => v ? rpK(v) : "–" },
    { h: "Bermasalah", f: (r) => r.mati + r.sl, num: true, fmt: rpK, bar: true },

  ];
  const rentangSlow = () => namaBulan(D.meta.slow_dari.slice(0, 7)) + " – " + namaBulan(D.meta.slow_sampai.slice(0, 7));
  async function pSlow(sec) {
    await muatLain("slow_moving");
    const all = D.slow_moving.filter((r) => !S.cabang || r.cabang === S.cabang);
    const rows = slowFilter(), nilai = sum(all, "nilai"), masalah = sum(all.filter(bermasalah), "nilai");
    const mati = all.filter((r) => r.status === "MATI - 0 TERJUAL");
    const merks = [...new Set(D.slow_moving.map((r) => brandItem(r.item)))].sort();
    const selM = el("select", { id: "selMerk" }, el("option", { value: "", text: "Semua merk" }), merks.map((x) => el("option", { value: x, text: x })));

    selS.value = S.status || ""; selS.addEventListener("change", () => { S.status = selS.value; render(); });

    const pilihCabang = (r) => {
      S.cabang = r.key;
      if (![...$("#selCabang").options].some((x) => x.value === r.key)) $("#selCabang").append(el("option", { value: r.key, text: r.key }));
      $("#selCabang").value = r.key; render();

  // ---------- retur penjualan ----------
  // grafik batang retur per bulan; tinggi = nilai retur, tooltip = % terhadap omset
  function chartRetur(host, data) {   // data: [{bulan, retur, omset}]
    host.replaceChildren();
    const W = Math.max(280, host.clientWidth || 600), H = 220, mL = 64, mB = 24, mT = 10, mR = 8;
    const max = Math.max(1, ...data.map((d) => d.retur));
    const c = warnaCss();
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Nilai retur per bulan" });
    const y = (v) => mT + (H - mT - mB) * (1 - v / max);
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      svg.append(svgEl("line", { x1: mL, x2: W - mR, y1: yy, y2: yy, stroke: c.line }));
      const tx = svgEl("text", { x: mL - 6, y: yy + 4, "text-anchor": "end" }); tx.textContent = rpK(v).replace("Rp ", ""); svg.append(tx);
    }
    const band = (W - mL - mR) / Math.max(1, data.length), bw = Math.min(34, band * 0.5);
    const tip = el("div", { class: "tip", hidden: true });
    data.forEach((d, i) => {
      const cx = mL + band * i + band / 2, top = y(d.retur);
      const r = svgEl("rect", { x: cx - bw / 2, width: bw, y: top, height: Math.max(1, y(0) - top), rx: 3, fill: d.bulan === S.bulan ? c.bad : c.bar });
      svg.append(r);
      const tx = svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle" }); tx.textContent = namaBulan(d.bulan); svg.append(tx);
      r.addEventListener("mouseenter", () => {
        tip.hidden = false;
        tip.replaceChildren(el("div", { class: "muted", text: namaBulan(d.bulan) }), el("div", { text: "Retur " + rpK(d.retur) }), el("div", { text: pct(d.omset ? d.retur / d.omset : null) + " dari omset " + rpK(d.omset) }));
        tip.style.left = Math.min(Math.max(0, cx / W * host.clientWidth - 80), host.clientWidth - 200) + "px"; tip.style.top = "6px";
      });
      r.addEventListener("mouseleave", () => (tip.hidden = true));
    });
    host.append(svg, tip);
  }

  async function pRetur(sec) {

    const hariData = new Date(D.meta.dibuat.slice(0, 10));

      .map((p) => { const n = notaRetur.get(p.nomor) || {}; return { ...p, nilai: -p.sisa, umur: umurRetur(p.tgl), penyelesaian: n.penyelesaian || "-", keterangan: n.keterangan || "", barang: barangNota.get(p.nomor) || [] }; });
    const email = kotakEmail(), foto = kotakFoto();
    const merekAda = [...new Set(terbuka.flatMap(merekRetur))].sort();
    const pilMerek = el("select", { id: "returMerek", "aria-label": "Merek untuk email pabrik" }, el("option", { value: "", text: "Pilih merek" }), ...merekAda.map((b) => el("option", { value: b, text: b })));

    const nTerbuka = sum(terbuka, "nilai");

    const rn = D.retur_nota.filter(filt), pj = D.penjualan.filter(filt);

  // kompen: syarat bayar yang diajukan (COD = 0 hari) vs jatuh tempo nota yang benar-benar dibuat

  // sheet "AJU HARGA 2026" (Google Sheets) - ditarik agen tiap malam ke data/aju_harga.json, hanya dibaca di sini.
  // Kak Intan, 26 Okt 2026: sheet tetap tempat input; SURABAYA di sheet = cabang GRESIK.
  function kartuAjuHarga() {
    const host = el("div", null, el("div", { class: "muted", text: "Memuat…" }));
    muatLain("aju_harga").catch(() => (D.aju_harga = [])).then(() => {
      const rs = (D.aju_harga || []).filter((r) => !S.cabang || r.cabang === S.cabang);
      const bawah = rs.filter((r) => (r.selisih || 0) < 0), belum = rs.filter((r) => !r.acc);
      host.replaceChildren(
        el("div", { class: "kpis" },
          kpi("Pengajuan harga", nf0.format(rs.length), "baris di sheet AJU HARGA" + (S.cabang ? " · " + S.cabang : "")),
          kpi("Belum ada ACC Ibu", nf0.format(belum.length), "kolom ACC IBU masih kosong", belum.length ? "warn" : ""),
          kpi("Di bawah harga minimum", nf0.format(bawah.length), bawah.length ? "total selisih " + rpK(bawah.reduce((a, r) => a + (r.selisih || 0) * (r.qty || 1), 0)) + " (× qty)" : "semua di atas harga minimum", bawah.length ? "down" : "")),
        table([
          { h: "Tgl", f: (r) => r.tgl, cls: "mono" },
          { h: "Cabang", f: (r) => r.cabang },
          { h: "Sales", f: (r) => r.sales },
          { h: "Pelanggan", f: (r) => r.pelanggan, node: (r) => el("span", null, r.pelanggan || "–", r.tempo ? el("div", { class: "muted", style: "font-size:12px", text: r.tempo }) : null) },
          { h: "Barang", f: (r) => r.kode, node: (r) => el("span", null, el("span", { class: "mono", text: r.kode }), el("div", { class: "muted", style: "font-size:12px", text: r.merk + (r.qty ? " · " + nf0.format(r.qty) + " unit" : "") })) },
          { h: "Nett", f: (r) => r.nett, num: true, fmt: (v) => v == null ? "–" : rp(v) },
          { h: "Harga minimum", f: (r) => r.harga_min, num: true, fmt: (v) => v == null ? "–" : rp(v) },
          { h: "Harga kompen", f: (r) => r.harga_kompen, num: true, node: (r) => el("b", { text: r.harga_kompen == null ? "–" : rp(r.harga_kompen) }) },
          { h: "Selisih", f: (r) => r.selisih, num: true, node: (r) => r.selisih == null ? el("span", { class: "muted", text: "–" }) : el("span", { class: r.selisih < 0 ? "down" : "up", text: rp(r.selisih) + (r.rugi != null ? " (" + pct(r.rugi) + ")" : "") }) },
          { h: "Promo / alasan", f: (r) => [r.campaign, r.promo, r.alasan].filter(Boolean).join(" · "), node: (r) => el("span", { style: "font-size:12px" }, [r.alasan, r.campaign, r.promo && r.promo !== r.campaign ? r.promo : ""].filter(Boolean).join(" · ") || "–", r.extra_pot ? el("div", { class: "muted", text: "extra pot " + r.extra_pot + (r.promo_berlaku ? " · " + r.promo_berlaku : "") }) : null) },
          { h: "ACC Ibu", f: (r) => r.acc, node: (r) => r.acc ? el("span", { class: "pill ok", text: r.acc }) : el("span", { class: "pill warn", text: "belum" }) },
          { h: "Status kompen", f: (r) => r.status },
        ], rs, { sort: 0, dir: "desc", maxH: "640px", empty: "Belum ada pengajuan harga di sheet untuk pilihan ini." }));
    });
    return card("Pengajuan harga · sheet AJU HARGA 2026",
      "Dibaca dari Google Sheets \"AJU HARGA 2026\" tiap malam. Input dan ACC tetap di sheet. Selisih = harga kompen − harga minimum; merah berarti di bawah harga minimum.",
      host);
  }

  /* menu penagihan BEN */
  // Penagihan: apa yang harus ditagih (lewat tempo + jatuh tempo 7 hari ke depan) dan uang yang sudah masuk.
  // Piutang dari data/piutang.json (sama dengan tab Piutang, hanya sisa positif); pembayaran dari
  // data/penagihan.json = penerimaan penjualan Accurate per faktur yang dibayar.
  async function pPenagihan(sec) {
    await Promise.all([muatLain("piutang"), muatLain("penagihan")]);
    const P = D.penagihan, hari = P.hari_ini;
    const tglD = (s) => new Date(s + "T00:00:00");
    const selisih = (a, b) => Math.round((tglD(a) - tglD(b)) / 864e5);   // hari dari b ke a
    const dHari = tglD(hari), senin = new Date(dHari); senin.setDate(dHari.getDate() - ((dHari.getDay() + 6) % 7));
    const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const awalMinggu = iso(senin), awalBulan = hari.slice(0, 8) + "01";
    const pu = D.piutang.filter((p) => p.sisa > 0 && filt(p)).map((p) => ({ ...p, sisaHari: selisih(p.jatuh_tempo, hari) }));
    const lewat = pu.filter((p) => p.sisaHari < 0);
    const segera = pu.filter((p) => p.sisaHari >= 0 && p.sisaHari <= 7);
    const tagih = lewat.concat(segera);
    const by = P.bayar.filter(filt);
    const masuk = by.filter((b) => b.tgl <= hari);
    const minggu = masuk.filter((b) => b.tgl >= awalMinggu), bulan = masuk.filter((b) => b.tgl >= awalBulan);
    const mundur = by.filter((b) => b.tgl > hari);
    const perSales = new Map();
    const ambilS = (sid) => { let x = perSales.get(sid); if (!x) perSales.set(sid, x = { sid, lewat: 0, segera: 0, minggu: 0, bulan: 0, mundur: 0, n: 0 }); return x; };
    for (const p of lewat) { const x = ambilS(p.sales_id); x.lewat += p.sisa; x.n++; }
    for (const p of segera) { const x = ambilS(p.sales_id); x.segera += p.sisa; x.n++; }
    for (const b of minggu) ambilS(b.sales_id).minggu += b.jumlah;
    for (const b of bulan) ambilS(b.sales_id).bulan += b.jumlah;
    for (const b of mundur) ambilS(b.sales_id).mundur += b.jumlah;
    const CARA = { BANK_TRANSFER: "TRANSFER", BANK_CHEQUE: "GIRO/CEK", CASH_OTHER: "TUNAI", EDC: "EDC", OTHERS: "LAINNYA" };
    const kolomBayar = [
      { h: "Tanggal", f: (r) => r.tgl },
      { h: "No. penerimaan", f: (r) => r.nomor, cls: "mono" },
      { h: "Pelanggan", f: (r) => r.pelanggan },
      { h: "Sales", f: (r) => namaSales(r.sales_id) },
      { h: "Faktur", f: (r) => r.faktur, cls: "mono" },
      { h: "Cara", f: (r) => CARA[r.cara] || r.cara },
      { h: "Jumlah", f: (r) => r.jumlah, num: true, fmt: rp, bar: true },
    ];
    const belum = P.penerimaan_belum_diambil_bot
      ? el("div", { class: "msg", text: "Data pembayaran belum lengkap: " + nf0.format(P.penerimaan_belum_diambil_bot) + " penerimaan sejak " + P.bayar_dari + " masih diambil dari Accurate. Angka uang masuk masih bisa bertambah." })
      : null;
    sec.replaceChildren(...[
      belum,
      el("div", { class: "kpis" },
        kpi("Lewat jatuh tempo", rpK(sum(lewat, "sisa")), nf0.format(lewat.length) + " faktur harus ditagih", lewat.length ? "down" : ""),
        kpi("Jatuh tempo 7 hari ke depan", rpK(sum(segera, "sisa")), nf0.format(segera.length) + " faktur"),
        kpi("Uang masuk minggu ini", rpK(sum(minggu, "jumlah")), "sejak " + awalMinggu),
        kpi("Uang masuk bulan ini", rpK(sum(bulan, "jumlah")), "sejak " + awalBulan),
        kpi("Giro mundur", rpK(sum(mundur, "jumlah")), nf0.format(mundur.length) + " baris, tanggal sesudah hari ini")),
      card("Penagihan per sales", "Lewat tempo dan jatuh tempo 7 hari ke depan dihitung dari sisa piutang; uang masuk dari penerimaan penjualan di Accurate. Data per " + hari + ".",
        table([
          { h: "Sales", f: (r) => namaSales(r.sid) },
          { h: "Lewat tempo", f: (r) => r.lewat, num: true, fmt: rpK, bar: true },
          { h: "Jatuh tempo 7 hari", f: (r) => r.segera, num: true, fmt: rpK },
          { h: "Faktur ditagih", f: (r) => r.n, num: true, fmt: nf0.format },
          { h: "Masuk minggu ini", f: (r) => r.minggu, num: true, fmt: rpK },
          { h: "Masuk bulan ini", f: (r) => r.bulan, num: true, fmt: rpK },
          { h: "Giro mundur", f: (r) => r.mundur, num: true, fmt: rpK },
        ], [...perSales.values()], { sort: 1, empty: "Tidak ada tagihan atau pembayaran untuk pilihan ini." })),
      card("Daftar tagih", "Faktur yang sudah lewat jatuh tempo dan yang jatuh tempo dalam 7 hari ke depan. Urutan bawaannya paling lama lewat dulu.",
        table([
          { h: "Faktur", f: (r) => r.nomor, cls: "mono" },
          { h: "Pelanggan", f: (r) => r.pelanggan },
          { h: "Sales", f: (r) => namaSales(r.sales_id) },
          { h: "Jatuh tempo", f: (r) => r.jatuh_tempo },
          { h: "Keadaan", f: (r) => -r.sisaHari, num: true, node: (r) => r.sisaHari < 0
              ? el("span", { class: "pill " + (r.sisaHari < -90 ? "bad" : r.sisaHari < -30 ? "warn" : "mut"), text: "lewat " + (-r.sisaHari) + " hari" })
              : el("span", { class: "pill ok", text: r.sisaHari === 0 ? "jatuh tempo hari ini" : r.sisaHari + " hari lagi" }) },
          { h: "Sisa piutang", f: (r) => r.sisa, num: true, fmt: rp, bar: true },
        ], tagih, { sort: 4, limit: 300, empty: "Tidak ada faktur yang perlu ditagih untuk pilihan ini." })),
      card("Uang masuk bulan ini", "Per faktur yang dibayar. Giro atau cek dicatat pada tanggal penerimaannya di Accurate.",
        table(kolomBayar, bulan, { sort: 0, dir: "desc", limit: 300, empty: "Belum ada pembayaran bulan ini untuk pilihan ini." })),
      mundur.length ? card("Giro mundur", "Penerimaan yang tanggalnya sesudah hari ini (biasanya giro yang belum jatuh tempo). Belum dihitung sebagai uang masuk.",
        table(kolomBayar, mundur, { sort: 0, dir: "asc", limit: 300 })) : null,
    ].filter(Boolean));
  }

  // ---------- navigasi ----------
  const PAGES = { ringkasan: pRingkasan, harian: pHarian, sales: pSales, laba: pLaba, slow: pSlow, beli: pPesan, piutang: pPiutang, penagihan: pPenagihan, retur: pRetur, program: pProgram, pengajuan: pPengajuan, aturan: pAturan };
  let renderSeq = 0;
  async function render() {
    const seq = ++renderSeq;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.p === S.page ? "true" : "false"));
    for (const id of Object.keys(PAGES)) { const sc = $("#" + id); if (sc) sc.hidden = id !== S.page; }
    const sec = $("#" + S.page);
    if (!sec) return;
    try { await PAGES[S.page](sec); }
    catch (e) { if (seq === renderSeq) sec.replaceChildren(el("div", { class: "msg", text: "Bagian ini gagal dimuat: " + (e.message || e) })); console.error(e); }
  }
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { S.page = t.dataset.p; try { history.replaceState(null, "", "#" + S.page); } catch (e) {} render(); }));
  $("#selBulan").addEventListener("change", (e) => { S.bulan = e.target.value; render(); });
  $("#selCabang").addEventListener("change", (e) => { S.cabang = e.target.value; render(); });
  $("#selSales").addEventListener("change", (e) => { S.sales = e.target.value === "" ? "" : +e.target.value; render(); });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.page === "ringkasan") render(); }, 250); });

  // ---------- penyimpanan isian (target, program, harga spesial) ----------
  async function sambungDb() {
    const c = window.claude;
    if (!c || !c.use) { S.canWrite = false; return; }
    c.use("mcp").then((m) => { S.mcp = m || null; }).catch(() => {});
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db) { S.canWrite = false; render(); return; }
    S.db = db;
    if (user) { try { S.uid = await user.id(); const w = await user.can("data.write"); S.canWrite = w === null ? null : !!w; } catch (e) {} }
    let pending = 0;
    const ulang = () => { clearTimeout(pending); pending = setTimeout(() => { const a = document.activeElement; if (a && a.matches("input,select,textarea") && a.closest("section.page")) return; render(); }, 150); };
    db.collection("target").onSnapshot((snap) => { S.target = { ...SINKRON.target }; for (const d of snap.docs) S.target[d.id] = d.data(); ulang(); }, () => {});
    db.collection("program").onSnapshot((snap) => { S.program = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); ulang(); }, () => {});
    db.collection("harga_spesial").onSnapshot((snap) => { S.harga = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); ulang(); }, () => {});
    db.collection("catatan_piutang").onSnapshot((snap) => { S.catatan = {}; for (const d of snap.docs) S.catatan[d.id] = d.data(); ulang(); }, () => {});
    db.collection("catatan_retur").onSnapshot((snap) => { S.catatanRetur = {}; for (const d of snap.docs) S.catatanRetur[d.id] = d.data(); ulang(); }, () => {});
    db.collection("foto_retur").onSnapshot((snap) => { S.fotoRetur = {}; for (const d of snap.docs) S.fotoRetur[d.id] = d.data(); ulang(); }, () => {});
    // pengajuan sales: cabang mengajukan di database halamannya, agen memindahkan ke pusat dan membawa keputusan balik
    db.collection("pengajuan").onSnapshot((snap) => { S.pengajuan = snap.docs.map((d) => ({ ...d.data(), _id: d.id })); ulang(); }, () => {});
    // program pembelian: selama aktif, batas stok pesanan pembelian boleh ditambah
    db.collection("program_beli").onSnapshot((snap) => { S.programBeli = snap.docs.map((d) => ({ ...d.data(), _id: d.id })).concat(SINKRON.program_beli); ulang(); }, () => {});
    // isian fix pesan & program per baris; di tab pesanan statusnya sudah diperbarui langsung saat mengetik,
    // jadi tab itu tidak digambar ulang (posisi gulir tabel tidak lompat)
    let pfAwal = true;
    db.collection("pesan_fix").onSnapshot((snap) => { S.pesanFix = { ...SINKRON.pesan_fix }; for (const d of snap.docs) S.pesanFix[d.id] = d.data(); if (S.page !== "beli" || pfAwal) ulang(); pfAwal = false; }, () => {});
  }

  muat().then((boleh) => {
    const h = location.hash.slice(1);
    if (PAGES[h] && (!boleh || boleh.includes(h))) S.page = h;
    render();
    sambungDb();
  }).catch((e) => { $("#ringkasan").replaceChildren(el("div", { class: "msg", text: "Data dashboard belum ada atau gagal dimuat (" + (e.message || e) + "). Minta Gio menjalankan ulang tarikan data Accurate." })); });
})();
</script>

  function bacaLayar() {

<script>
(() => {
  const dari64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const ket = document.getElementById("ketMasuk"), tombol = document.getElementById("tombolMasuk");
  const tampil = (t, salah) => { ket.textContent = t; ket.className = "ket" + (salah ? " salah" : ""); };
  async function ambil(p) { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  // Pengganti window.claude dengan penyimpanan di browser (antarmuka sama dengan shim.js server Mac):
  // use("db") -> collection(n).onSnapshot/add/doc(id), doc("n/id").set/update/delete; use("user"); use("downloads").
  function isianLokal() {
    const AWAL = "isian:" + location.pathname.replace(/index.html$/, "") + ":";
    const baca = (n) => { try { return JSON.parse(localStorage.getItem(AWAL + n) || "{}"); } catch (e) { return {}; } };
    const tulis = (n, isi) => { try { localStorage.setItem(AWAL + n, JSON.stringify(isi)); } catch (e) { throw { code: "failed", message: "Isian tidak bisa disimpan di browser ini" }; } };
    const pendengar = new Map();   // koleksi -> Set(cb)
    const kabari = (n) => { const s = baca(n), docs = Object.entries(s).map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) }));
      for (const cb of pendengar.get(n) || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } };
    addEventListener("storage", (e) => { if (e.key && e.key.startsWith(AWAL)) kabari(e.key.slice(AWAL.length)); });
    const dok = (n, id) => ({ id,
      async set(isi) { const s = baca(n); s[id] = isi; tulis(n, s); kabari(n); },
      async update(isi) { const s = baca(n); s[id] = { ...(s[id] || {}), ...isi }; tulis(n, s); kabari(n); },
      async delete() { const s = baca(n); delete s[id]; tulis(n, s); kabari(n); } });
    const db = {
      collection(n) { return {
        onSnapshot(cb) { if (!pendengar.has(n)) pendengar.set(n, new Set()); pendengar.get(n).add(cb); setTimeout(() => kabari(n), 0); return () => pendengar.get(n).delete(cb); },
        async add(isi) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await dok(n, id).set(isi); return { id }; },
        doc(id) { return dok(n, id); } }; },
      doc(jalur) { const [n, id] = String(jalur).split("/"); return dok(n, id); },
    };
    const pengguna = { async id() { return "browser-ini"; }, async can(h) { return h === "data.write" ? true : null; } };
    const unduhan = { async save({ filename, data }) { const b = data instanceof Blob ? data : new Blob([data]); const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = filename || "unduhan"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000); } };
    return { use(nama) { return Promise.resolve(nama === "db" ? db : nama === "user" ? pengguna : nama === "downloads" ? unduhan : null); } };
  }
  // Isian BERSAMA di Mac (Joe 31 Okt 2026; isian_web.py di layanan chat): masuk dengan akun & sandi halaman ini,
  // baca tiap 30 detik + sesudah menulis. Gagal tersambung -> isian browser ini (isianLokal) dengan pita peringatan.
  async function isianServer(akun, sandi) {
    const API = "https://svarna5s-mac-mini.tail7a15d8.ts.net/api/isian/";
    const kirim = async (jalan, isi, token) => {
      const r = await fetch(API + jalan, { method: "POST", body: JSON.stringify(isi),
        headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 403 ? "permission_denied" : "failed", message: d.galat || ("gagal " + r.status) };
      return d;

    const { token } = await kirim("masuk", { akun, sandi });

    const kabari = (n) => { const s = cache.get(n) || {}, docs = Object.entries(s).map(([id, d]) => ({ id, data: () => JSON.parse(JSON.stringify(d)) }));
      for (const cb of pendengar.get(n) || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } };

      const d = await kirim("tulis", { koleksi: n, id, op, isi }, token);
      const s = cache.get(n) || {};
      if (d.isi) s[id] = d.isi; else delete s[id];
      cache.set(n, s); kabari(n);
    };

    const db = {
      collection(n) { return {
        onSnapshot(cb) { if (!pendengar.has(n)) pendengar.set(n, new Set()); pendengar.get(n).add(cb); if (cache.has(n)) setTimeout(() => kabari(n), 0); else tarik(n); return () => pendengar.get(n).delete(cb); },
        async add(isi) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await dok(n, id).set(isi); return { id }; },
        doc(id) { return dok(n, id); } }; },
      doc(jalur) { const [n, id] = String(jalur).split("/"); return dok(n, id); },

    return JSON.parse(teks);
  }

    ev.preventDefault();

      const jt = pk.data && pk.data.jatuh_tempo;
      if (Array.isArray(jt)) {

      }
      const m = document.getElementById("masuk"), i = document.getElementById("isi"), w = document.getElementById("webDibuat");
      if (m) m.hidden = true;
      if (i) i.hidden = false;
      if (w && pk.dibuat) w.textContent = new Date(pk.dibuat).toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" });
      document.body.classList.add("terbuka");
      window.dash._isi(pk);
      return;
    }
    const isianBersama = isianServer(akun, sandi).catch((e) => { console.error("isian bersama", e); return null; });
    // halaman GIO membaca data/<nama>.json - dilayani dari paket yang sudah dibuka, tidak ke internet
    const asli = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const m = String(u && u.url || u).match(/(?:^|\/)data\/([\w.-]+\.json)(?:[?#]|$)/);
      if (!m) return asli(u, o);

      if (belum) document.body.prepend(Object.assign(document.createElement("div"), { id: "pita-belum",

    } catch (e) { console.error(e); }
    // Isian (fix pesan + approve, target, catatan, pengajuan, dst.) seperti artifact asli: pengganti window.claude.
    // db & user = penyimpanan bersama Mac (isianServer); bila gagal tersambung -> browser ini saja (isianLokal) + pita.
    if (!window.claude) {

          if (b) return nama === "db" ? b.db : b.pengguna;
          if (!document.getElementById("pita-isian")) document.body.append(Object.assign(document.createElement("div"), { id: "pita-isian",
            textContent: "ISIAN (TARGET, CATATAN, PENGAJUAN) TERSIMPAN DI BROWSER INI SAJA" }));
          return lokal.use(nama);

    }

    const s = document.createElement("script");
    s.textContent = document.getElementById("gio-utama").textContent;
    document.body.append(s);
  });
})();
